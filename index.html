<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quote-container">

        <p class="label">✨ DAILY INSPIRATION</p>

        <div class="quote-box">

            <span class="quote-icon">“</span>

            <p id="quote">
                Believe you can and you're halfway there.
            </p>

            <p id="author">— Theodore Roosevelt</p>

        </div>

        <div class="buttons">

            <button id="newQuoteBtn">
                New Quote
            </button>

            <button id="copyBtn">
                Copy Quote
            </button>

        </div>

        <p id="message"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
